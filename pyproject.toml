[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-ui"
version = "0.1.0"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["robotsix_ui"]

[tool.pytest.ini_options]
testpaths = ["tests/python-helper"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
files = ["robotsix_ui", "tests/python-helper"]

# Tests are type-checked, but without strict's annotation requirements.
[[tool.mypy.overrides]]
module = ["test_init", "test_fetch"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
