[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-ui"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["robotsix_ui"]

[tool.pytest.ini_options]
testpaths = ["robotsix_ui"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["robotsix_ui"]
exclude = ['(^|/)test_.*\.py$']
