[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-ui"
version = "0.1.0"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["robotsix_ui"]

[tool.pytest.ini_options]
testpaths = ["robotsix_ui"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
files = ["robotsix_ui"]
exclude = ['(^|/)test_.*\.py$']