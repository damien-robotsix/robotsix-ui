name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-javascript-typescript:
    name: CodeQL (javascript-typescript)
    permissions:
      security-events: write # upload CodeQL SARIF results
      contents: read # check out the repo for analysis
      actions: read # read workflow run metadata for CodeQL
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0
    with:
      languages: javascript-typescript

  codeql-python:
    name: CodeQL (python)
    permissions:
      security-events: write # upload CodeQL SARIF results
      contents: read # check out the repo for analysis
      actions: read # read workflow run metadata for CodeQL
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0
    with:
      languages: python
      build-mode: none
