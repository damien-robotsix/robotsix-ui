name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, 'chore(release)') &&
       !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.3.0
        with:
          node-version: "22"

      - name: Determine bump type
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.version_bump }}" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and update changelog
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          TODAY=$(date +%Y-%m-%d)

          # Date the current unreleased changelog entry as the release
          sed -i "s/^## $OLD_VERSION (unreleased)/## $OLD_VERSION ($TODAY)/" CHANGELOG.md

          # Bump version for the next dev cycle
          npm version "${{ steps.bump.outputs.type }}" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "OLD_VERSION=$OLD_VERSION" >> "$GITHUB_ENV"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

          # Prepend a new unreleased section for the next dev cycle.
          # Two newlines, not three: a third leaves a double blank line before
          # the previous heading, which `prettier --check .` rejects — so every
          # release commit left main's own lint job red until someone noticed.
          sed -i "1s/^/## $NEW_VERSION (unreleased)\n\n/" CHANGELOG.md

      - name: Commit, tag, and push
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v$OLD_VERSION"
          git tag -a "v$OLD_VERSION" -m "Release v$OLD_VERSION"
          git push origin main
          git push origin "v$OLD_VERSION"

      - name: Build release assets
        run: |
          git fetch --tags
          git checkout "v$OLD_VERSION"
          npm ci
          npm run build

      # The stylesheet alone is not a consumable panel. A server-rendered UI
      # with no bundler loads the framework-free bundle with a plain
      # <script type="module">, so vanilla.js has to be fetchable the same way
      # style.css is — otherwise every non-React component can style a config
      # panel it has no way to mount.
      - name: Create GitHub Release with CSS and vanilla-JS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$OLD_VERSION" \
            --title "v$OLD_VERSION" \
            --notes "Release v$OLD_VERSION" \
            dist/style.css \
            dist/vanilla.js \
            dist/vanilla.js.map
