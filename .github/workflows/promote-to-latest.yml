name: Promote next to latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (leave blank for current @next)"
        required: false
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.3.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/
          cache: "npm"
      - run: npm ci
      - name: Promote next to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(npm view @robotsix/ui dist-tags.next 2>/dev/null) || true
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::No @next version found on npm. Publish a canary release first."
            exit 1
          fi
          echo "Promoting @robotsix/ui@${VERSION} from next to latest"
          npm dist-tag add "@robotsix/ui@${VERSION}" latest
