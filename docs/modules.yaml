modules:
  - id: core
    description: "Library entry points (React and framework-free) and public types"
    paths:
      - src/css.d.ts
      - src/index.ts
      - src/vanilla.ts
      - .robotsix-mill/config.yaml
      - .robotsix-mill/periodic/agent_check.yaml
      - .robotsix-mill/periodic/audit.yaml
      - .robotsix-mill/periodic/bc_check.yaml
      - .robotsix-mill/periodic/completeness_check.yaml
      - .robotsix-mill/periodic/copy_paste.yaml
      - .robotsix-mill/periodic/docstring_coverage.yaml
      - .robotsix-mill/periodic/health.yaml
      - .robotsix-mill/periodic/module_curator.yaml
      - .robotsix-mill/periodic/module_size.yaml
      - .robotsix-mill/periodic/mypy_baseline.yaml
      - .robotsix-mill/periodic/pin_bump.yaml
      - .robotsix-mill/periodic/repo_description_sync.yaml
      - .robotsix-mill/periodic/survey.yaml
      - .robotsix-mill/periodic/test_gap.yaml
      - .robotsix-mill/periodic/trace_review.yaml
      - .robotsix-mill/periodic/triage_boilerplate.yaml

  - id: styles
    description: "Design tokens, base CSS, shared component styles, and utilities"
    paths:
      - src/styles/tokens.css
      - src/styles/base.css
      - src/styles/components.css
      - src/styles/components.css.test.ts
      - src/styles/utilities.css
      - src/styles/index.css

  - id: config-panel
    description: >
      Schema-driven settings panel: the fleet's reference implementation of the
      config-ownership standard's UI affordance and HTTP surface.
    paths:
      - src/config-panel/index.ts
      - src/config-panel/types.ts
      - src/config-panel/schema.ts
      - src/config-panel/render.ts
      - src/config-panel/section-state.ts
      - src/config-panel/section-state.test.ts
      - src/config-panel/render-rows.ts
      - src/config-panel/render-rows.test.ts
      - src/config-panel/render-array.ts
      - src/config-panel/render-map.ts
      - src/config-panel/collect.ts
      - src/config-panel/client.ts
      - src/config-panel/panel.ts
      - src/config-panel/html.ts
      - src/config-panel/html.test.ts
      - src/config-panel/schema.test.ts
      - src/config-panel/render.test.ts
      - src/config-panel/map.test.ts
      - src/config-panel/client.test.ts
      - src/config-panel/panel.test.ts

  - id: config-panel-react
    description: "React wrapper that mounts the framework-free config panel"
    paths:
      - src/config-panel-react/ConfigPanel.tsx
      - src/config-panel-react/ConfigPanel.test.tsx
      - src/config-panel-react/index.ts

  - id: app-shell
    description: "Framework-free app shell: the fleet's shared top-level navigation"
    paths:
      - src/appshell/index.ts
      - src/appshell/types.ts
      - src/appshell/appshell.ts
      - src/appshell/appshell.test.ts

  - id: app-shell-react
    description: "React wrapper that mounts the framework-free app shell"
    paths:
      - src/components/AppShell/AppShell.tsx
      - src/components/AppShell/AppShell.test.tsx
      - src/components/AppShell/index.ts

  - id: test-support
    description: "Test setup utilities"
    paths:
      - src/test-setup.ts

  - id: docs
    description: "Documentation"
    paths:
      - AGENT.md
      - CHANGELOG.md
      - README.md
      - SECURITY.md
      - docs/app-shell.md
      - docs/consumption.md
      - docs/config-panel.md
      - docs/modules.yaml

  - id: python-helper
    description: "Python helper for resolving robotsix-ui CSS release URLs"
    paths:
      - pyproject.toml
      - robotsix_ui/__init__.py
      - robotsix_ui/test_init.py
