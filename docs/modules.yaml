modules:
  - id: core
    description: "Library entry points (React and framework-free) and public types"
    paths:
      - changelog.d/20260807T135306Z-add-agent-md-with-project-context-for-ai-62c8.doc.md
      - changelog.d/20260809T151447Z-robotsix-ui-add-robotsix-mill-config-yam-c5f1.misc.md
      - src/css.d.ts
      - src/index.ts
      - src/vanilla.ts
      - .robotsix-mill/config.yaml
      - changelog.d/20260807T123853Z-config-editor-auto-derive-langfuse-proje-74e7.feature.md
      - changelog.d/20260807T135307Z-use-function-regex-form-for-external-in-5b3d.misc.md
      - changelog.d/20260812T094234Z-robotsix-ui-enable-triage-boilerplate-pe-30e8.misc.md
      - changelog.d/20260821T094525Z-add-a-shared-appshell-navigation-menu-co-c896.feature.md
      - changelog.d/20260821T135748Z-update-robotsix-mill-config-yaml-languag-d33e.misc.md
      - changelog.d/20260828T164926Z-robotsix-ui-enable-agent-check-periodic-0c10.misc.md
      - changelog.d/20260828T164926Z-robotsix-ui-enable-pin-bump-periodic-wor-a392.misc.md
      - changelog.d/*.md

  - id: styles
    description: "Design tokens, base CSS, shared component styles, and utilities"
    paths:
      - src/styles/tokens.css
      - src/styles/base.css
      - src/styles/components.css
      - src/styles/utilities.css
      - src/styles/index.css

  - id: config-panel
    description: >
      Schema-driven settings panel: the fleet's reference implementation of the
      config-ownership standard's UI affordance and HTTP surface.
    paths:
      - src/config/index.ts
      - src/config/types.ts
      - src/config/schema.ts
      - src/config/render.ts
      - src/config/collect.ts
      - src/config/client.ts
      - src/config/panel.ts
      - src/config/html.ts
      - src/config/schema.test.ts
      - src/config/render.test.ts
      - src/config/map.test.ts
      - src/config/client.test.ts
      - src/config/panel.test.ts

  - id: config-panel-react
    description: "React wrapper that mounts the framework-free config panel"
    paths:
      - src/components/ConfigPanel/ConfigPanel.tsx
      - src/components/ConfigPanel/ConfigPanel.test.tsx
      - src/components/ConfigPanel/index.ts

  - id: app-shell
    description: "Framework-free app shell: the fleet's shared top-level navigation"
    paths:
      - src/appshell/index.ts
      - src/appshell/types.ts
      - src/appshell/appshell.ts
      - src/appshell/appshell.test.ts

  - id: app-shell-react
    description: "React wrapper that mounts the framework-free app shell"
    paths:
      - src/components/AppShell/AppShell.tsx
      - src/components/AppShell/AppShell.test.tsx
      - src/components/AppShell/index.ts

  - id: test-support
    description: "Test setup utilities"
    paths:
      - src/test-setup.ts

  - id: docs
    description: "Documentation"
    paths:
      - AGENT.md
      - docs/app-shell.md
      - docs/consumption.md
      - docs/config-panel.md

  - id: python-helper
    description: "Python helper for resolving robotsix-ui CSS release URLs"
    paths:
      - pyproject.toml
      - robotsix_ui/__init__.py
      - robotsix_ui/test_init.py
